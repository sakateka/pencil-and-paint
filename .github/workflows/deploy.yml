name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache the browser Playwright downloads — around 150MB, and it only
      # changes when Playwright itself does. Keyed on the resolved version
      # rather than the lockfile, so an unrelated dependency bump does not
      # throw the browser away.
      - id: playwright-version
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.v }}

      # Run unconditionally: it verifies and skips the download when the cache
      # restored the browser, and cannot leave a half-populated cache working
      # by accident.
      - run: npx playwright install chromium

      # System libraries live on the runner, not in the cache, so they are
      # installed every time regardless of whether the browser was restored.
      - run: npx playwright install-deps chromium

      # Typechecks, then bundles to dist/.
      - run: npm run build

      # Playwright drives the real build in a headless browser.
      - run: npm test

      - name: Prepare site
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Only publish from main; pull requests build and test but do not deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
